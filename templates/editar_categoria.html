{% extends 'base.html' %}

{% block content %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css')}}">
  <div class="card shadow-sm p-4 card-custom">
    <h3 style="color: #0e2c58;"><center>Editar Categoria</center></h3>
    <hr />
     <form method="POST">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label class="form-label"><b>Nome da Categoria</b></label>
          <input type="text" name="nome_categoria" value="{{ categoria.nome if categoria else '' }}" class="form-control" required/>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-success w-100">Salvar Alterações</button>
        </div>

        <div class="col-12 mt-3 text-center">
          <a href="{{ url_for('categories.listar') }}" class="btn btn-secondary">Voltar para Categorias</a>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
